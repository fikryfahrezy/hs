pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{css,html,json,js,jsx,md,mjs,ts,tsx,yaml,yml}"
      run: npx oxfmt --write {staged_files}
    lint:
      glob: "*.{js,jsx,mjs,ts,tsx}"
      run: npx oxlint --deny-warnings {staged_files}
    typecheck:
      run: npm run typecheck
